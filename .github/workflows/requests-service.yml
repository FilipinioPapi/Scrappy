name: Build request service

on:
  push:
    paths:
      - "requests-service/**"
      - ".github/workflows/requests-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: requests-service
        run: npm test
      # Only main and preview-build publish the image people pull; other branches just test.
      - name: Log in to GitHub's image registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview-build'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview-build'
      - name: Build and publish
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview-build'
        uses: docker/build-push-action@v6
        with:
          context: requests-service
          platforms: linux/amd64,linux/arm64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/filipiniopapi/scrappy-requests:${{ github.ref == 'refs/heads/main' && 'latest' || 'preview' }}
