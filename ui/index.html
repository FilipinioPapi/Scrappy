<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scrappy Media Center</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="intro" aria-hidden="true">
    <div class="intro-mid">
      <img class="intro-dog" src="logo.png" alt="">
      <div class="intro-name">SCRAPPY</div>
      <div class="intro-sub">MEDIA CENTER</div>
      <div class="intro-dots"><i></i><i></i><i></i></div>
    </div>
    <div class="intro-foot">
      <img src="jaydenater.gif" alt="">
      <div><div class="k">POWERED BY</div><div class="n">JAYDENATER<span class="bt">BOT</span></div></div>
    </div>
  </div>
  <header id="topbar" hidden>
    <a class="brand" href="#/home" aria-label="Scrappy home"><img src="logo.png" alt=""><div><div class="brand-name">SCRAPPY</div><div class="brand-sub">MEDIA CENTER <span class="dot">·</span> <span class="nas">JJsNAS</span></div></div></a>
    <nav class="tabs">
      <a href="#/home" data-tab="home">Movies &amp; TV</a>
      <a href="#/music" data-tab="music">Music</a>
      <a href="#/audiobooks" data-tab="audiobooks">Audiobooks</a>
    </nav>
    <div class="tsearch" id="tsearch">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input type="search" id="tq" placeholder="Search…" spellcheck="false" autocomplete="off" aria-label="Search">
      <button type="button" class="gb tadv" title="Advanced search" aria-label="Advanced search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <div class="tdrop" hidden></div>
    </div>
    <div class="actions">

      <div class="refresh-wrap">
        <button class="icon-btn" id="refreshBtn" title="Refresh (right-click for more)" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.8 10.6a7.4 7.4 0 0 1 13.4-3.7"/><path d="M18.7 3.2v4h-4"/><path d="M19.2 13.4a7.4 7.4 0 0 1-13.4 3.7"/><path d="M5.3 20.8v-4h4"/></svg>
        </button>
        <div class="menu ref-menu" id="refMenu" hidden></div>
      </div>
      <div class="refresh-wrap">
        <button class="icon-btn" id="topStatsBtn" title="Stats (right-click for all three)" aria-label="Stats">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="13" width="4" height="7" rx="1.4"/><rect x="10" y="8.5" width="4" height="11.5" rx="1.4"/><rect x="16" y="4" width="4" height="16" rx="1.4"/></svg>
        </button>
        <div class="menu ref-menu stats-menu" id="statsMenu" hidden></div>
      </div>
      <div class="user-menu">
        <button class="icon-btn" id="userBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <div class="menu" id="userMenu" hidden>
          <div class="menu-h">Settings</div>
          <div class="menu-info" id="userInfo"></div>
          <label class="toggle">Auto-play next episode <input type="checkbox" id="autoplayToggle"></label>
          <label class="toggle">Play in separate mpv window <input type="checkbox" id="windowModeToggle"></label>
          <button id="serversBtn">Servers</button>
          <button id="clearCacheBtn">Clear image cache</button>
          <button id="logoutBtn">Sign out</button>
        </div>
      </div>
    </div>
  </header>
  <main id="view"></main>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
