<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrappy sign-in</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#120C0C;color:#F6E9E9;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:22px 16px 60px}
.w{max-width:460px;margin:0 auto}h1{margin:0;color:#EC282E;font-size:30px;letter-spacing:1px;font-weight:900}
.sub{color:#BFA7A8;margin:4px 0 18px}.c{background:#1E1415;border-radius:16px;padding:16px;margin-top:12px}
.c h2{margin:0;font-size:20px}.c small{color:#BFA7A8}.hd{display:flex;align-items:flex-start;gap:10px}.hd>div{flex:1}
.ok{background:rgba(80,200,120,.12);color:#7FD69B;font-weight:700}
.sk{display:flex;align-items:center;color:#BFA7A8}.sk span{flex:1}
.got{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(80,200,120,.12);font-size:15px}
.got span{flex:1;color:#7FD69B;font-weight:700;word-break:break-all}
input{width:100%;height:50px;border-radius:12px;border:1px solid #3A2526;background:#2C1C1D;color:#fff;font:inherit;padding:0 14px;margin-top:10px}
input:focus{outline:2px solid #EDA7AA}
button{width:100%;height:52px;border:0;border-radius:12px;background:#EC282E;color:#fff;font:inherit;font-weight:800;margin-top:12px}
button:disabled{opacity:.5}button.l{background:none;color:#EDA7AA;height:auto;width:auto;margin:0;padding:6px 0;text-align:left;font-weight:700}
button.s{width:auto;height:36px;margin:0;padding:0 16px;border-radius:10px;background:#2C1C1D;color:#F6E9E9;font-size:15px;font-weight:700}
button.o{background:none;border:1px solid #3A2526;color:#EDA7AA;height:48px;margin-top:16px}
.e{color:#ff8f93;margin-top:8px;min-height:0}.gone{color:#BFA7A8;text-align:center;margin-top:40px}
</style></head><body><div class="w">
<h1>SCRAPPY</h1><div class="sub">Signing in on your TV. Type here and the TV fills in by itself.</div>
<div id="out"></div></div>
<script>
// Each server: its address first (Connect checks the server is there), then the username and
// password. Skip moves the TV on. Nothing typed here is kept once the TV has it.
var base = location.pathname.replace(/\/$/, ''), out = document.getElementById('out');
var last = null, pending = {}, n = 0, drawn = '', vals = {}, st = {};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function keep(){document.querySelectorAll('input').forEach(function(i){vals[i.id]=i.value})}
function send(path, b){ return fetch(base + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(poll); }
function draw(){
  var key = JSON.stringify([st.servers, st.results, pending, !!last, st.same]);
  if (key === drawn) return; drawn = key; keep();
  var act = document.activeElement && document.activeElement.id;
  var list = st.servers || [];
  var html = list.map(function(s){
    if (s.signedIn) return '<div class="c ok">✓ '+esc(s.name)+' · signed in as '+esc(s.user)+'</div>';
    if (s.skipped) return '<div class="c sk"><span>'+esc(s.name)+' · skipped</span><button type="button" class="l" data-unskip="'+s.kind+'">Set up instead</button></div>';
    var r = (st.results||{})[s.kind], p = pending[s.kind], busy = p && !(r && r.n === p.n);
    var err = r && p && r.n === p.n && !r.ok ? r.error : '';
    var head = '<div class="hd"><div><h2>'+esc(s.name)+'</h2><small>'+esc(s.what)+'</small></div><button type="button" class="s" data-skip="'+s.kind+'">Skip</button></div>';
    if (!s.checked) {
      return '<form class="c" data-k="'+s.kind+'" data-step="check">'+head+
        '<input id="a-'+s.kind+'" placeholder="Server address" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url" value="'+esc(vals['a-'+s.kind]!=null?vals['a-'+s.kind]:(s.address||''))+'">'+
        '<div class="e">'+esc(err)+'</div><button'+(busy?' disabled':'')+'>'+(busy?'Connecting…':'Connect')+'</button></form>';
    }
    var same = last || st.same;
    return '<form class="c" data-k="'+s.kind+'" data-step="login">'+head+
      '<div class="got"><span>✓ Connected to '+esc(s.address)+'</span><button type="button" class="l" data-change="'+s.kind+'">Change</button></div>'+
      '<input id="u-'+s.kind+'" placeholder="Username" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username" value="'+esc(vals['u-'+s.kind]||'')+'">'+
      '<input id="p-'+s.kind+'" placeholder="Password" type="password" autocomplete="current-password" value="'+esc(vals['p-'+s.kind]||'')+'">'+
      (same ? '<button type="button" class="l" data-same="'+s.kind+'">Use the same username and password</button>' : '')+
      '<div class="e">'+esc(err)+'</div><button'+(busy?' disabled':'')+'>'+(busy?'Signing in…':'Sign in')+'</button></form>';
  }).join('');
  var anyIn = list.some(function(s){return s.signedIn}), done = list.length && list.every(function(s){return s.signedIn || s.skipped});
  if (done) html += '<div class="gone">'+(anyIn ? 'All done. You can put your phone down.' : 'You skipped all three. Tap "Set up instead" on one to sign in.')+'</div>';
  else if (anyIn) html += '<button type="button" class="o" data-open="1">Skip the rest and open Scrappy</button>';
  out.innerHTML = html;
  if (act && document.getElementById(act)) document.getElementById(act).focus();
}
out.addEventListener('click', function(e){
  var t = e.target, a = function(k){ return t.getAttribute && t.getAttribute(k); };
  var k;
  if ((k = a('data-skip'))) send('/act', { act: 'skip', kind: k, n: ++n });
  else if ((k = a('data-unskip'))) send('/act', { act: 'unskip', kind: k, n: ++n });
  else if ((k = a('data-change'))) { delete pending[k]; send('/act', { act: 'change', kind: k, n: ++n }); }
  else if (a('data-open')) send('/act', { act: 'open', n: ++n });
  else if ((k = a('data-same'))) {
    if (last) { document.getElementById('u-'+k).value = last.user; document.getElementById('p-'+k).value = last.pass; }
    else { var s = (st.servers||[]).filter(function(x){return x.kind===k})[0]; pending[k] = { n: ++n }; drawn = ''; send('/login', { kind: k, address: s ? s.address : '', same: true, n: n }); }
  }
});
out.addEventListener('submit', function(e){ e.preventDefault(); var f = e.target, k = f.getAttribute('data-k'); keep();
  if (f.getAttribute('data-step') === 'check') {
    var addr = (vals['a-'+k]||'').trim(); if (!addr) return;
    pending[k] = { n: ++n }; drawn = '';
    send('/act', { act: 'check', kind: k, address: addr, n: n });
    return;
  }
  var s = (st.servers||[]).filter(function(x){return x.kind===k})[0];
  var b = { kind: k, address: s ? s.address : '', user: (vals['u-'+k]||'').trim(), pass: vals['p-'+k]||'', n: ++n };
  if (!b.user) return; pending[k] = { n: b.n, user: b.user, pass: b.pass }; drawn = '';
  send('/login', b); });
function poll(){ fetch(base + '/state', { cache: 'no-store' }).then(function(r){ if (!r.ok) throw 0; return r.json() }).then(function(s){
    st = s || {};
    Object.keys(st.results||{}).forEach(function(k){ var r = st.results[k], p = pending[k];
      if (r.ok && p && r.n === p.n && r.phase === 'login' && p.user) { last = { user: p.user, pass: p.pass }; vals['p-'+k] = ''; } });
    draw();
  }).catch(function(){ out.innerHTML = '<div class="gone">The TV has left its sign-in screen. Open Sign in on the TV to get a new code.</div>'; drawn = ''; }); }
poll(); setInterval(poll, 1200);
</script></body></html>
