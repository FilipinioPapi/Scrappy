[package]
name = "scrappy"
version = "0.1.0"
description = "Scrappy Media Center - a lean Emby client"
edition = "2021"

[lib]
name = "scrappy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "multipart"] }
libloading = "0.8"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
tokio = { version = "1", features = ["time", "macros"] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
